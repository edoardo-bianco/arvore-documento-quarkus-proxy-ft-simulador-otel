quarkus.application.name=simtr-hub-test
quarkus.http.test-port=8082
quarkus.devservices.enabled=false

# Testes unitarios nao devem depender de rede, API Manager, OIDC real ou backend de observabilidade.
simtr.apikey=test-apikey

quarkus.flow.messaging.defaults-enabled=true
quarkus.flow.messaging.lifecycle-enabled=false
quarkus.flow.tracing.enabled=false
quarkus.flow.devui.backend.storage.enabled=true

# O bootstrap de teste valida a configuracao, mas nao inicia nem acessa o Ollama.
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.ollama.enable-integration=false
quarkus.langchain4j.ollama.base-url=http://localhost:1/
quarkus.langchain4j.ollama.chat-model.model-id=llama3.2:3b
quarkus.langchain4j.ollama.chat-model.temperature=0.2
quarkus.langchain4j.ollama.chat-model.model-options.num-ctx=2048
quarkus.langchain4j.ollama.chat-model.format=json
quarkus.langchain4j.ollama.timeout=60s

quarkus.rest-client.parametrizacao-processo.url=http://localhost:1
quarkus.rest-client.parametrizacao-processo.connect-timeout=100
quarkus.rest-client.parametrizacao-processo.read-timeout=100

quarkus.rest-client.parametrizacao-checklist.url=http://localhost:1
quarkus.rest-client.parametrizacao-checklist.connect-timeout=100
quarkus.rest-client.parametrizacao-checklist.read-timeout=100

quarkus.rest-client.dossie-produto.url=http://localhost:1
quarkus.rest-client.dossie-produto.connect-timeout=100
quarkus.rest-client.dossie-produto.read-timeout=100

quarkus.rest-client.gestao-documento.url=http://localhost:1
quarkus.rest-client.gestao-documento.connect-timeout=100
quarkus.rest-client.gestao-documento.read-timeout=100

simtr-hub.simulador.parametrizacao-processo.habilitado=true
simtr-hub.simulador.parametrizacao-checklist.habilitado=true
simtr-hub.simulador.dossie-produto.habilitado=true
simtr-hub.simulador.gestao-documento.habilitado=true

quarkus.oidc.enabled=false
quarkus.oidc-client.enabled=true
quarkus.oidc-client.auth-server-url=http://localhost:1/auth/realms/test
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=/protocol/openid-connect/token
quarkus.oidc-client.client-id=test-client
quarkus.oidc-client.credentials.client-secret.value=test-secret
quarkus.oidc-client.connection-timeout=PT0.1S
quarkus.oidc-client.connection-retry-count=0
quarkus.oidc-client.grant.type=CLIENT

quarkus.otel.traces.exporter=cdi
quarkus.otel.simple=true
quarkus.otel.logs.enabled=false
quarkus.otel.logs.handler.enabled=false
quarkus.otel.logs.exporter=none

simtr-hub.observabilidade.rest-client.payload.habilitado=false

quarkus.log.file.enabled=false
quarkus.log.console.json.enabled=false

quarkus.jacoco.report=true
quarkus.jacoco.report-location=target/jacoco-report
quarkus.jacoco.title=simtr-hub
