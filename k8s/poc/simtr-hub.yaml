apiVersion: v1
kind: Service
metadata:
  name: simtr-hub
  labels:
    app.kubernetes.io/name: simtr-hub
spec:
  selector:
    app.kubernetes.io/name: simtr-hub
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simtr-hub
  labels:
    app.kubernetes.io/name: simtr-hub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simtr-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simtr-hub
    spec:
      serviceAccountName: simtr-hub-durable-flow
      terminationGracePeriodSeconds: 40
      initContainers:
        - name: ollama-check
          image: simtr-hub-poc:local
          imagePullPolicy: Never
          command:
            - /bin/bash
            - -ec
            - >-
                curl --fail --silent --show-error
                http://host.docker.internal:11434/api/tags
                | grep --fixed-strings "\"name\":\"${OLLAMA_MODEL}\"" >/dev/null
          env:
            - name: OLLAMA_MODEL
              valueFrom:
                secretKeyRef:
                  name: simtr-hub-poc-secrets
                  key: OLLAMA_MODEL
      containers:
        - name: simtr-hub
          image: simtr-hub-poc:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUARKUS_PROFILE
              value: poc,kubernetes
            - name: CONFORMIDADE_PERSISTENCIA_BACKEND
              value: couchdb
            - name: COUCHDB_HOST
              value: couchdb
            - name: COUCHDB_PORT
              value: "5984"
            - name: COUCHDB_DATABASE
              value: conformidade
            - name: COUCHDB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: simtr-hub-poc-secrets
                  key: COUCHDB_USERNAME
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simtr-hub-poc-secrets
                  key: COUCHDB_PASSWORD
            - name: QUARKUS_REDIS_HOSTS
              value: redis://valkey:6379
            - name: OLLAMA_BASE_URL
              value: http://host.docker.internal:11434/
            - name: OLLAMA_MODEL
              valueFrom:
                secretKeyRef:
                  name: simtr-hub-poc-secrets
                  key: OLLAMA_MODEL
            - name: SIMTR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: simtr-hub-poc-secrets
                  key: SIMTR_API_KEY
            - name: QUARKUS_OIDC_TENANT_ENABLED
              value: "false"
            - name: QUARKUS_OIDC_CLIENT_CLIENT_ENABLED
              value: "false"
            - name: QUARKUS_LOG_FILE_ENABLED
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
