apiVersion: v1
kind: Service
metadata:
  name: couchdb
  labels:
    app.kubernetes.io/name: couchdb
spec:
  selector:
    app.kubernetes.io/name: couchdb
  ports:
    - name: http
      port: 5984
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-conformidade-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: couchdb
  labels:
    app.kubernetes.io/name: couchdb
spec:
  serviceName: couchdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: couchdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: couchdb
    spec:
      containers:
        - name: couchdb
          image: couchdb:3.5.2
          ports:
            - name: http
              containerPort: 5984
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: simtr-hub-poc-secrets
                  key: COUCHDB_USERNAME
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simtr-hub-poc-secrets
                  key: COUCHDB_PASSWORD
            - name: COUCHDB_DATABASE
              value: conformidade
            # O containerd do kind pode expor nofile perto de 2^30. Sem limitar
            # os ports do Erlang, o BEAM pre-aloca mais de 2 GiB no startup.
            - name: ERL_FLAGS
              value: "+Q 65536"
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - >-
                    until curl --fail --silent --show-error
                    http://127.0.0.1:5984/_up >/dev/null; do sleep 1; done;
                    status=$(curl --silent --output /dev/null --write-out '%{http_code}'
                    --user "$COUCHDB_USER:$COUCHDB_PASSWORD" --request PUT
                    "http://127.0.0.1:5984/$COUCHDB_DATABASE");
                    test "$status" = "201" || test "$status" = "412"
          startupProbe:
            httpGet:
              path: /_up
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                    curl --fail --silent --show-error
                    --user "$COUCHDB_USER:$COUCHDB_PASSWORD"
                    "http://127.0.0.1:5984/$COUCHDB_DATABASE" >/dev/null
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: couchdb-conformidade-data
              mountPath: /opt/couchdb/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: couchdb-conformidade-data
          persistentVolumeClaim:
            claimName: couchdb-conformidade-data
